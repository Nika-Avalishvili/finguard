name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: finguard
          POSTGRES_USER: finguard
          POSTGRES_PASSWORD: finguard_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Create test database with pgvector
        env:
          PGPASSWORD: finguard_dev
        run: |
          psql -h localhost -U finguard -d finguard -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U finguard -d postgres -c "CREATE DATABASE finguard_test OWNER finguard;"
          psql -h localhost -U finguard -d finguard_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Build and test
        run: ./mvnw verify --batch-mode --no-transfer-progress